<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="Tapestree hero">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081114"/>
      <stop offset=".52" stop-color="#0E2724"/>
      <stop offset="1" stop-color="#165041"/>
    </linearGradient>
    <radialGradient id="glow" cx="76%" cy="36%" r="54%">
      <stop offset="0" stop-color="#5EB397" stop-opacity=".28"/>
      <stop offset=".6" stop-color="#2E7C68" stop-opacity=".10"/>
      <stop offset="1" stop-color="#081114" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7FC8AE"/>
      <stop offset=".55" stop-color="#42A887"/>
      <stop offset="1" stop-color="#1B7D67"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="430" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="430" rx="28" fill="url(#grid)"/>
  <rect width="1200" height="430" rx="28" fill="url(#glow)"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <rect x="402" y="56" width="396" height="36" rx="18" fill="#FFFFFF" fill-opacity=".065" stroke="#91D2BC" stroke-opacity=".18"/>
    <circle cx="421" cy="74" r="5" fill="#72C2A5"/>
    <text x="610" y="79" fill="#B7DED1" font-size="13" font-weight="700" letter-spacing="1.7">OPERATIONAL CHANGE WORKSPACE</text>

    <text x="600" y="172" fill="#F4FAF7" font-size="88" font-weight="750" letter-spacing="-2.4">Tapestree</text>
    <text x="600" y="228" fill="#93D5BF" font-size="33" font-weight="600">Operational change, with memory.</text>

    <text x="600" y="286" fill="#D6E4DF" font-size="20">Plan technical changes. Perform them deliberately.</text>
    <text x="600" y="317" fill="#D6E4DF" font-size="20">Validate outcomes. Preserve what your team learns.</text>

    <g transform="translate(350 356)">
      <rect x="0" y="0" width="500" height="2" rx="1" fill="url(#accent)" opacity=".95"/>
      <text x="250" y="34" fill="#8CA89F" font-size="12.5" font-weight="700" letter-spacing="2.6">PLAN  •  PERFORM  •  VALIDATE  •  LEARN</text>
    </g>
  </g>
</svg>
