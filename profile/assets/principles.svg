<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F1A1B"/>
      <stop offset="1" stop-color="#122622"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#79C7AA"/>
      <stop offset="1" stop-color="#227460"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="410" rx="26" fill="url(#pbg)"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="50" y="56" fill="#EAF5F0" font-size="19" font-weight="800" letter-spacing="1.4">PRODUCT PRINCIPLES</text>
    <text x="50" y="84" fill="#809D94" font-size="14">Strong operations without the enterprise ceremony.</text>

    <g transform="translate(50 116)">
      <rect width="520" height="112" rx="18" fill="#152725" stroke="#263F3A"/>
      <rect width="5" height="112" rx="3" fill="url(#stripe)"/>
      <text x="28" y="37" fill="#A6DDCA" font-size="15" font-weight="800">GOVERNANCE LIVES INSIDE THE WORK</text>
      <text x="28" y="68" fill="#D3E2DD" font-size="14">Good process should improve the change while it is happening,</text>
      <text x="28" y="91" fill="#D3E2DD" font-size="14">not reconstruct it afterward for an audit.</text>
    </g>

    <g transform="translate(630 116)">
      <rect width="520" height="112" rx="18" fill="#152725" stroke="#263F3A"/>
      <rect width="5" height="112" rx="3" fill="url(#stripe)"/>
      <text x="28" y="37" fill="#A6DDCA" font-size="15" font-weight="800">VALIDATION IS PART OF EXECUTION</text>
      <text x="28" y="68" fill="#D3E2DD" font-size="14">A successful command is not proof that the environment</text>
      <text x="28" y="91" fill="#D3E2DD" font-size="14">reached the intended state.</text>
    </g>

    <g transform="translate(50 252)">
      <rect width="520" height="112" rx="18" fill="#152725" stroke="#263F3A"/>
      <rect width="5" height="112" rx="3" fill="url(#stripe)"/>
      <text x="28" y="37" fill="#A6DDCA" font-size="15" font-weight="800">DOCUMENTATION SHOULD FALL OUT OF THE WORK</text>
      <text x="28" y="68" fill="#D3E2DD" font-size="14">Intent, evidence, outcomes, and lessons should survive</text>
      <text x="28" y="91" fill="#D3E2DD" font-size="14">without demanding a second documentation project.</text>
    </g>

    <g transform="translate(630 252)">
      <rect width="520" height="112" rx="18" fill="#152725" stroke="#263F3A"/>
      <rect width="5" height="112" rx="3" fill="url(#stripe)"/>
      <text x="28" y="37" fill="#A6DDCA" font-size="15" font-weight="800">SUPPORT THE ENGINEER, DO NOT SUPERVISE THEM</text>
      <text x="28" y="68" fill="#D3E2DD" font-size="14">Tapestree should raise the operational floor without becoming</text>
      <text x="28" y="91" fill="#D3E2DD" font-size="14">another surveillance layer.</text>
    </g>
  </g>
</svg>